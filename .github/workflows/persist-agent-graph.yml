name: Persist Agent Graph

# Runs after every push to develop (i.e. after a PR is merged).
# Regenerates the agent graph and commits the result directly to develop.
#
# Loop prevention:
#   - paths-ignore excludes pushes that only touch docs/agent-graph/,
#     so the commit produced by this workflow does not re-trigger it.
#   - The commit message includes [skip ci] to suppress ci.yml on that push.
#
# Authentication:
#   BOT_PAT is required because github-actions[bot] is a system account and
#   cannot be added to the bypass list of branch protection rules or Rulesets.
#   GITHUB_TOKEN is rejected with 403 on protected branches.
#   BOT_PAT must be a fine-grained PAT with Contents: Read & Write scope
#   on this repository, stored as a repository secret named BOT_PAT.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/agent-graph/**'  # Ignore own commits to prevent infinite loop

permissions:
  contents: read  # Actual write auth is delegated to BOT_PAT at checkout

# Only one run at a time. If multiple PRs are merged in quick succession,
# cancel the in-progress run and let the latest push win.
concurrency:
  group: persist-agent-graph
  cancel-in-progress: true

jobs:
  persist:
    name: Persist agent graph to develop
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # Using BOT_PAT here causes all subsequent git operations (including
      # git push) to authenticate as the token owner, bypassing the branch
      # protection rule on develop.
      # =========================
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0  # Full history gives graphify richer relationship context
          token: ${{ secrets.BOT_PAT }}

      # =========================
      # .NET + GRAPHIFY-DOTNET
      # =========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  # graphify-dotnet targets net10.0 and requires the .NET 10 SDK

      - name: Install graphify-dotnet
        # Run install from /tmp to avoid global.json in the repo root, which pins
        # the SDK to 8.0.x and prevents dotnet from using the .NET 10 SDK installed above.
        run: |
          mkdir -p /tmp/dotnet-tool-install
          cd /tmp/dotnet-tool-install
          dotnet tool install --global graphify-dotnet

      - name: Regenerate agent graph (code + docs + infra)
        run: |
          ~/.dotnet/tools/graphify run . \
            --format wiki,report,json \
            --output docs/agent-graph

      # =========================
      # DOCUMENTATION NOTICE
      # =========================
      - name: Generate LLM content-type notice
        run: |
          mkdir -p docs/agent-graph
          cat > docs/agent-graph/NOTICE.md << 'NOTICE_EOF'
          # Agent Graph — Content Notice

          > This file is auto-generated by the `persist-agent-graph` workflow.
          > Do not edit manually.

          ## Node Types in This Graph

          ### Source Code nodes — `src/`, `tests/`
          Contain **C# implementation logic**.
          These nodes represent executable behaviour, domain models, services,
          and test coverage. Treat them as the authoritative source of truth
          for how XPoster works at runtime.

          ### Documentation nodes — `docs/` (excluding `docs/agent-graph/`)
          Contain **natural language text only**.
          These nodes do **NOT** contain code.
          They describe architectural intent, configuration options, deployment
          procedures, setup guides, and decision records.
          Treat them as knowledge context and intent documentation,
          **not** as executable or parseable artifacts.

          ### Infrastructure nodes — `infra/`
          Contain **IaC and configuration files** (e.g. Bicep, ARM, YAML).
          These nodes define cloud resources and deployment topology.
          They are not C# code but are structured and parseable.

          ### Generated nodes — `docs/agent-graph/`
          This folder itself. Auto-generated on every push to `develop`.
          Do not use these nodes as source-of-truth for code or docs content.

          ## Metadata

          | Field | Value |
          |---|---|
          | Generated by | `persist-agent-graph` GitHub Actions workflow |
          | Trigger | push to `develop` (post-merge persistence) |
          | Tool | `graphify-dotnet` |
          | Output formats | wiki, report, json |
          NOTICE_EOF

      # =========================
      # COMMIT AND PUSH
      # Commits only if the graph actually changed.
      # Loop prevention is handled by paths-ignore above.
      # We intentionally avoid [skip ci] because GitHub would skip
      # all push/pull_request workflows for that commit, not only ci.yml.
      # git push uses the BOT_PAT credential set at checkout.
      # =========================
      - name: Commit updated graph to develop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/agent-graph/
          if git diff --cached --quiet; then
            echo "✅ No changes to the agent graph — nothing to commit."
          else
            git commit -m "docs(graph): regenerate agent graph [agent-graph-sync]"
            git push
            echo "✅ Agent graph updated and pushed to develop."
          fi