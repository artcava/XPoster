name: Regenerate Agent Graph

# Runs as a PR check on every PR targeting develop.
# Generates a preview of the agent graph and uploads it as a downloadable artifact.
# Does NOT commit anything to develop — that is the responsibility of persist-agent-graph.yml.
on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read  # Read-only: this workflow never writes to the repository

# Cancel any in-progress run for the same PR to avoid wasting CI minutes on stale pushes.
concurrency:
  group: regenerate-agent-graph-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Generate agent graph preview
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history gives graphify richer relationship context

      # =========================
      # .NET + GRAPHIFY-DOTNET
      # =========================
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  # graphify-dotnet targets net10.0 and requires the .NET 10 SDK

      - name: Install graphify-dotnet
        # Run install from /tmp to avoid global.json in the repo root, which pins
        # the SDK to 8.0.x and prevents dotnet from using the .NET 10 SDK installed above.
        run: |
          mkdir -p /tmp/dotnet-tool-install
          cd /tmp/dotnet-tool-install
          dotnet tool install --global graphify-dotnet

      - name: Regenerate agent graph (code + docs + infra)
        run: |
          ~/.dotnet/tools/graphify run . \
            --format wiki,report,json \
            --output docs/agent-graph

      # =========================
      # DOCUMENTATION NOTICE
      # Generates a NOTICE.md that explicitly annotates node types for LLMs.
      # =========================
      - name: Generate LLM content-type notice
        run: |
          mkdir -p docs/agent-graph
          cat > docs/agent-graph/NOTICE.md << 'NOTICE_EOF'
          # Agent Graph — Content Notice

          > This file is auto-generated by the `regenerate-agent-graph` workflow.
          > Do not edit manually.

          ## Node Types in This Graph

          ### Source Code nodes — `src/`, `tests/`
          Contain **C# implementation logic**.
          These nodes represent executable behaviour, domain models, services,
          and test coverage. Treat them as the authoritative source of truth
          for how XPoster works at runtime.

          ### Documentation nodes — `docs/` (excluding `docs/agent-graph/`)
          Contain **natural language text only**.
          These nodes do **NOT** contain code.
          They describe architectural intent, configuration options, deployment
          procedures, setup guides, and decision records.
          Treat them as knowledge context and intent documentation,
          **not** as executable or parseable artifacts.

          ### Infrastructure nodes — `infra/`
          Contain **IaC and configuration files** (e.g. Bicep, ARM, YAML).
          These nodes define cloud resources and deployment topology.
          They are not C# code but are structured and parseable.

          ### Generated nodes — `docs/agent-graph/`
          This folder itself. Auto-generated on every PR against `develop` (pre-merge preview).
          Do not use these nodes as source-of-truth for code or docs content.

          ## Metadata

          | Field | Value |
          |---|---|
          | Generated by | `regenerate-agent-graph` GitHub Actions workflow |
          | Trigger | PR check against `develop` (pre-merge preview) |
          | Tool | `graphify-dotnet` |
          | Output formats | wiki, report, json |
          NOTICE_EOF

      # =========================
      # UPLOAD ARTIFACT
      # The graph is uploaded as a downloadable artifact for review in the PR.
      # It is NOT committed to develop here.
      # Persistence to develop is handled by persist-agent-graph.yml after merge.
      # =========================
      - name: Upload agent graph preview
        uses: actions/upload-artifact@v6
        with:
          name: agent-graph-preview
          path: docs/agent-graph/
          retention-days: 7
